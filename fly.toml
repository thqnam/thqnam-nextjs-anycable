app = "vercel-cable"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]
  PORT = "8080"
  ANYCABLE_BROKER = "memory"
  # ANYCABLE_HTTP_BROADCAST_SECRET = "2a0a42f344fe354c6c2f79406df1655d1b8038f4a637d593e071535e246bec32" # set via secrets
  # ANYCABLE_RPC_HOST = "http://thqnam-nextjs-anycable.vercel.app/api/anycable" # set via secrets
  # ANYCABLE_DEBUG = "true" # uncomment to enable debug logging

  # ADVANCED: enable NATS broker for multi-node setup (NOTE: at least 3 nodes are required)
  # ANYCABLE_BROKER = "nats"

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []

  # ADVANCED: Configure the size of the cluster when using NATS-based broker
  # auto_stop_machines = true
  # auto_start_machines = true
  # min_machines_running = 3

  [services.concurrency]
    hard_limit = 10000
    soft_limit = 10000
    type = "connections"

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
